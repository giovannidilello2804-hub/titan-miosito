<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roblox Builder 3D - Il Costruttore di papà</title>
  <meta name="description" content="Gioco 3D Costruttore stile Roblox/Minecraft. Costruisci case, castelli e città in 3D con modalità Volo e Blueprint.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Three.js 3D Engine & Canvas Confetti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- 3D Canvas Viewport -->
  <div id="game-container"></div>

  <!-- 3D Crosshair Pointer -->
  <div id="crosshair" class="crosshair">+</div>

  <!-- TOP HUD HEADER BAR -->
  <header class="hud-bar">
    <div class="hud-left">
      <div class="logo-box">
        <span class="logo-icon">🧱</span>
        <span class="logo-text">ROBLOX <span class="highlight-yellow">BUILDER 3D</span></span>
      </div>
      <div class="mode-badge" id="flyStatusBadge">🕊️ VOLO ATTIVO (Premi F)</div>
    </div>

    <!-- Quick Blueprints / Templates -->
    <div class="blueprints-bar">
      <span class="bp-title">✨ Costruzioni Rapide:</span>
      <button class="bp-btn" onclick="buildTemplate('house')">🏠 Casetta</button>
      <button class="bp-btn" onclick="buildTemplate('castle')">🏰 Castello</button>
      <button class="bp-btn" onclick="buildTemplate('tower')">🗼 Torre Neon</button>
      <button class="bp-btn" onclick="buildTemplate('tree')">🌳 Albero 3D</button>
    </div>

    <div class="hud-right">
      <button class="hud-btn save-btn" onclick="saveWorld()">💾 Salva</button>
      <button class="hud-btn clear-btn" onclick="clearWorld()">🗑️ Svuota</button>
      <button class="hud-btn audio-btn" id="btnAudio" onclick="toggleAudio()">🔊</button>
    </div>
  </header>

  <!-- NOTIFICATION TOAST -->
  <div id="toast" class="toast hidden"></div>

  <!-- BOTTOM BLOCK PALETTE BAR -->
  <div class="block-toolbar">
    <div class="toolbar-title">🎨 Seleziona Blocco da Piazzare:</div>
    <div class="palette-list" id="paletteList">
      <button class="block-slot active" data-type="grass" onclick="setSelectBlock('grass')">
        <span class="block-icon">🌱</span> Erba
      </button>
      <button class="block-slot" data-type="brick" onclick="setSelectBlock('brick')">
        <span class="block-icon">🧱</span> Mattoni
      </button>
      <button class="block-slot" data-type="wood" onclick="setSelectBlock('wood')">
        <span class="block-icon">🪵</span> Legno
      </button>
      <button class="block-slot" data-type="stone" onclick="setSelectBlock('stone')">
        <span class="block-icon">🪨</span> Pietra
      </button>
      <button class="block-slot" data-type="gold" onclick="setSelectBlock('gold')">
        <span class="block-icon">✨</span> Oro
      </button>
      <button class="block-slot" data-type="neon_cyan" onclick="setSelectBlock('neon_cyan')">
        <span class="block-icon">⚡</span> Neon Ciano
      </button>
      <button class="block-slot" data-type="neon_pink" onclick="setSelectBlock('neon_pink')">
        <span class="block-icon">💖</span> Neon Rosa
      </button>
      <button class="block-slot" data-type="water" onclick="setSelectBlock('water')">
        <span class="block-icon">🌊</span> Acqua
      </button>
      <button class="block-slot" data-type="glass" onclick="setSelectBlock('glass')">
        <span class="block-icon">🪟</span> Vetro
      </button>
      <button class="block-slot" data-type="lava" onclick="setSelectBlock('lava')">
        <span class="block-icon">🔥</span> Lava
      </button>
    </div>
  </div>

  <!-- TOUCH / MOBILE CONTROLS -->
  <div class="touch-overlay" id="touchControls">
    <div id="joystickZone" class="joystick-base">
      <div id="joystickKnob" class="joystick-knob"></div>
    </div>
    <div class="touch-actions">
      <button class="t-btn place-btn" id="btnTouchPlace">➕ PIAZZA</button>
      <button class="t-btn break-btn" id="btnTouchBreak">❌ DISTRUGGI</button>
      <button class="t-btn fly-btn" onclick="toggleFly()">🕊️ VOLA</button>
    </div>
  </div>

  <!-- INSTRUCTIONS BAR -->
  <footer class="footer-instructions">
    <span>⌨️ <strong>Controlli PC:</strong> W A S D / Frecce = Muoviti | SPAZIO = Vola Su | SHIFT = Scendi | <strong>CLICK SINISTRO</strong> = Piazza Blocco | <strong>CLICK DESTRO (o Q)</strong> = Rimuovi Blocco | <strong>F</strong> = Attiva/Disattiva Volo</span>
  </footer>

  <script src="game.js"></script>
</body>
</html>
