# ==============================================================
# Nginx Reverse Proxy Config per Raspberry Pi
# ==============================================================

server {
    listen 80;
    server_name _;

    # Aumenta la dimensione massima dei caricamenti file per Nextcloud (10GB)
    client_max_body_size 10G;
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;

    # 1. Rotta per il Cloud Server (Nextcloud)
    location /cloud {
        return 301 /cloud/;
    }

    location /cloud/ {
        proxy_pass http://nextcloud:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets ed headers aggiuntivi per la sincronizzazione file
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Redirezione automatica per la sincronizzazione dei contatti e calendari Nextcloud
    location /.well-known/carddav {
        return 301 $scheme://$host/cloud/remote.php/dav;
    }
    location /.well-known/caldav {
        return 301 $scheme://$host/cloud/remote.php/dav;
    }

    # 3. Rotta per il Solo Mining Controller (Public Pool / ESP32 / Bitaxe)
    location /miner/ {
        proxy_pass http://public_pool:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Rotta di default: Portale Principale e Web Server
    location / {
        proxy_pass http://webserver:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
