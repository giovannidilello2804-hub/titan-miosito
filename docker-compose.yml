version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Database MariaDB (Ottimizzato per Raspberry Pi 4 2GB RAM)
  # -------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: rpi_nextcloud_db
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin-trust-function-creators=1 --innodb-buffer-pool-size=256M --innodb-log-file-size=64M
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    networks:
      - internal_network

  # -------------------------------------------------------------
  # 2. Redis Cache (In-Memory Caching per Nextcloud)
  # -------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: rpi_redis
    restart: always
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    networks:
      - internal_network

  # -------------------------------------------------------------
  # 3. Nextcloud (Server Cloud Personale - Stile Google Drive)
  # -------------------------------------------------------------
  nextcloud:
    image: nextcloud:apache
    container_name: rpi_nextcloud_app
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "${NEXTCLOUD_PORT}:80"
    volumes:
      - nextcloud_data:/var/www/html/data
      - nextcloud_config:/var/www/html
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - REDIS_HOST=redis
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_LIMIT=10G
    networks:
      - internal_network

  # -------------------------------------------------------------
  # 4. Web Server Nginx (Per ospitare i tuoi siti web)
  # -------------------------------------------------------------
  webserver:
    image: nginx:alpine
    container_name: rpi_webserver
    restart: always
    ports:
      - "${WEBSERVER_PORT}:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./config/webserver/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal_network

  # -------------------------------------------------------------
  # 5. Reverse Proxy Nginx (Smista il traffico sulla porta 80)
  # -------------------------------------------------------------
  reverse_proxy:
    image: nginx:alpine
    container_name: rpi_reverse_proxy
    restart: always
    ports:
      - "${PROXY_PORT}:80"
      - "${PROXY_SSL_PORT}:443"
    volumes:
      - ./config/nginx-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextcloud
      - webserver
    networks:
      - internal_network

  # -------------------------------------------------------------
  # 6. Solo Mining Pool & Dashboard (Per Bitaxe, ESP32 e ASIC)
  # -------------------------------------------------------------
  public_pool:
    image: publicpool/public-pool:latest
    container_name: rpi_solo_miner_pool
    restart: always
    ports:
      - "3333:3333"  # Porta Stratum V1 per ESP32 / Bitaxe / ASIC
      - "5000:5000"  # Web Dashboard UI & API
    environment:
      - PORT=5000
      - STRATUM_PORT=3333
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  db_data:
  nextcloud_data:
  nextcloud_config:
